<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Физика зертханасы, 7-сынып</title>
<style>
:root{--paper:#edf2ee;--ink:#16324a;--teal:#0f8b8d;--amber:#e8a33d;--red:#c8453b;--line:#c9d6d0;--ok:#157a4a}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);line-height:1.45;
background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/24px 24px,var(--paper)}
header{padding:22px 20px 8px;max-width:1100px;margin:auto}
h1{margin:0;font-size:1.9rem;letter-spacing:-.02em}
header p{margin:4px 0 0;max-width:62ch}
nav{display:flex;flex-wrap:wrap;gap:8px;max-width:1100px;margin:14px auto 0;padding:0 20px}
nav button{font:inherit;font-weight:600;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:8px;padding:8px 16px;cursor:pointer}
nav button[aria-selected=true]{background:var(--ink);color:#fff}
main{max-width:1100px;margin:14px auto 40px;padding:0 20px}
section{display:none}section.on{display:block}
.intro{margin:0 0 12px;max-width:70ch}
.grid{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:20px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}canvas{order:-1}}
.side{display:flex;flex-direction:column;gap:12px}
.c label{display:block;font-size:.92rem;margin-bottom:2px}
.c b{color:var(--teal)}
.c input[type=range]{width:100%;accent-color:var(--teal)}
.c select{width:100%;font:inherit;padding:6px;border:2px solid var(--ink);border-radius:6px;background:#fff}
.out{background:#fff;border-left:5px solid var(--teal);padding:10px 12px;border-radius:0 6px 6px 0;font-size:.95rem}
.out .ok,.msg.ok{color:var(--ok)}.out .bad,.msg.bad{color:var(--red)}
canvas{width:100%;height:auto;background:#fff;border:2px solid var(--ink);border-radius:6px}
.task{background:#fff;border:2px dashed var(--ink);border-radius:8px;padding:12px}
.clock{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--teal)}
.clock.low{color:var(--red)}
.q{margin:6px 0 10px;min-height:3.2em}
.ans{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ans input{flex:1;font:inherit;padding:7px;border:2px solid var(--ink);border-radius:6px;min-width:0}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns button,.run,.rec,.xl{font:inherit;font-weight:600;padding:8px 14px;border-radius:6px;border:2px solid var(--ink);background:var(--amber);color:var(--ink);cursor:pointer}
.btns button:disabled{opacity:.45;cursor:not-allowed}
.msg{margin:8px 0 0;font-weight:600}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-top:10px}
.bar input{font:inherit;padding:7px;border:2px solid var(--ink);border-radius:6px;min-width:240px}
.c .fv{width:100%;margin-top:6px;font:inherit;padding:6px;border:2px solid var(--ink);border-radius:6px}.c small{display:block;color:#4d6475;font-size:.78rem;margin-top:3px}
.log{max-height:170px;overflow:auto;font-size:.8rem}.log table{border-collapse:collapse;width:100%}
.log th,.log td{border:1px solid var(--line);padding:3px 5px;background:#fff;text-align:left}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
</style>
</head>
<body>
<header>
<h1>Физика зертханасы, 7-сынып</h1>
<p>Жүгірткілерді жылжытып, құбылыстың қалай өзгеретінін көр. Әр симуляторда 1 минут 30 секундқа арналған тапсырма бар.</p>
<div class="bar"><label>Оқушының аты-жөні <input id="who" type="text" placeholder="Аты-жөні"></label></div>
</header>
<nav id="tabs" role="tablist"></nav>
<main id="main"></main>

<script>
const $=(s,r=document)=>r.querySelector(s);
const G=10,C={ink:'#16324a',teal:'#0f8b8d',amber:'#e8a33d',red:'#c8453b',grid:'#c9d6d0'};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const fmt=(x,d=2)=>String(+x.toFixed(d)).replace('.',',');
const line=(c,x1,y1,x2,y2,col=C.ink,w=2)=>{c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()};
const txt=(c,s,x,y,col=C.ink,f='14px Segoe UI,Arial,sans-serif',al='left')=>{c.fillStyle=col;c.font=f;c.textAlign=al;c.fillText(s,x,y)};
function arrow(c,x1,y1,x2,y2,col){line(c,x1,y1,x2,y2,col,4);const a=Math.atan2(y2-y1,x2-x1);c.fillStyle=col;c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-12*Math.cos(a-.4),y2-12*Math.sin(a-.4));c.lineTo(x2-12*Math.cos(a+.4),y2-12*Math.sin(a+.4));c.fill()}
function graph(c,x0,y0,w,h,xm,ym,xl,yl,title){
  c.fillStyle='#fff';c.fillRect(x0,y0,w,h);
  for(let i=0;i<=5;i++){const x=x0+w*i/5,y=y0+h*i/5;line(c,x,y0,x,y0+h,C.grid,1);line(c,x0,y,x0+w,y,C.grid,1);
    txt(c,fmt(xm*i/5,0),x,y0+h+15,C.ink,'11px Arial','center');txt(c,fmt(ym*(5-i)/5,0),x0-6,y+4,C.ink,'11px Arial','right')}
  line(c,x0,y0,x0,y0+h);line(c,x0,y0+h,x0+w,y0+h);
  txt(c,xl,x0+w,y0+h+32,C.ink,'12px Arial','right');txt(c,yl,x0,y0-8,C.ink,'12px Arial');txt(c,title,x0+w/2,y0-8,C.teal,'bold 13px Arial','center');
  return[t=>x0+w*t/xm,v=>y0+h-h*v/ym]}
const liquidColor=r=>r<900?'#ecc96a':r>1100?'#cfe6d2':'#8fd3e0';

const sims=[
/* ---------- 1. Қозғалыс ---------- */
{id:'motion',title:'Қозғалыс',
cols:['v, м/с','t, с','s, м'],row:p=>[p.v,p.t,p.v*p.t],
intro:'Бірқалыпты қозғалыс: s = v · t. Жылдамдық пен уақытты өзгертіп, s-t және v-t графиктерін бақыла. v-t графигіндегі боялған аудан жолға тең.',
ctrls:[{k:'v',l:'Жылдамдық v',u:'м/с',min:0,max:20,step:1,val:5},{k:'t',l:'Уақыт t',u:'с',min:1,max:30,step:1,val:10}],
extra:'<button class="run">Қозғалысты көрсету</button>',
init(S,sec){$('.run',sec).onclick=()=>{S.tc=0;let last=performance.now();const f=n=>{S.tc+=(n-last)/1000*3;last=n;if(S.tc>=S.p.t){S.tc=null}else requestAnimationFrame(f);S.upd()};requestAnimationFrame(f)}},
draw(c,p,S){const tc=Math.min(S.tc??p.t,p.t),s=p.v*tc;
  line(c,30,70,610,70,C.ink,3);
  for(let i=0;i<=6;i++){const x=30+i*580/6;line(c,x,63,x,77,C.ink,2);txt(c,i*100+' м',x,98,C.ink,'12px Arial','center')}
  c.fillStyle=C.amber;c.beginPath();c.arc(30+s/600*580,48,14,0,7);c.fill();c.strokeStyle=C.ink;c.lineWidth=2;c.stroke();
  txt(c,'s = '+fmt(s,0)+' м',20,28,C.ink,'bold 15px Arial');
  const[X1,Y1]=graph(c,50,160,250,200,30,600,'t, с','s, м','s-t графигі');
  line(c,X1(0),Y1(0),X1(tc),Y1(s),C.teal,3);c.fillStyle=C.red;c.beginPath();c.arc(X1(tc),Y1(s),5,0,7);c.fill();
  const[X2,Y2]=graph(c,370,160,250,200,30,20,'t, с','v, м/с','v-t графигі');
  c.fillStyle='rgba(15,139,141,.25)';c.fillRect(X2(0),Y2(p.v),X2(tc)-X2(0),Y2(0)-Y2(p.v));
  line(c,X2(0),Y2(p.v),X2(tc),Y2(p.v),C.teal,3);
  txt(c,'аудан = s',X2(tc/2),Y2(p.v/2)+4,C.ink,'12px Arial','center')},
out(p){return`s = v · t = ${p.v} · ${p.t} = <b>${p.v*p.t} м</b><br>Графиктегі түзу көлбеуі жылдамдықты көрсетеді.`},
task(){const v=rnd([2,3,4,5,6,8,10,12,15]),t=rnd([2,3,4,5,6,8,10,12,15,20]),s=v*t,k=rnd([0,1,2]);
  return k===0?{q:`Дене ${v} м/с жылдамдықпен ${t} с бойы бірқалыпты қозғалды. Жүрген жолын тап.`,a:s,u:'м'}
  :k===1?{q:`Дене ${t} с ішінде ${s} м жол жүрді. Жылдамдығы қандай?`,a:v,u:'м/с'}
  :{q:`Жылдамдығы ${v} м/с дене ${s} м жолды қанша уақытта жүріп өтеді?`,a:t,u:'с'}}},

/* ---------- 2. Архимед күші ---------- */
{id:'arch',title:'Архимед күші',
cols:['V, см³','ρ дене, кг/м³','ρ сұйық, кг/м³','Батыру, %','P, Н','F_A, Н','Динамометр, Н'],row(p){const r=this.calc(p);return[p.V,+p.rb.toFixed(3),p.rl,p.fr,+r.P.toFixed(3),+r.Fa.toFixed(3),+r.dyn.toFixed(3)]},
intro:'F_A = ρ_сұйық · g · V_батқан. Денені сұйыққа біртіндеп батырып, динамометрдің көрсетуі қалай азаятынын бақыла (g = 10 Н/кг).',
ctrls:[{k:'V',l:'Дене көлемі V',u:'см³',min:50,max:500,step:10,val:200},
{k:'rb',l:'Дене тығыздығы ρ',u:'кг/м³',min:200,max:8000,step:100,val:2700,free:true},
{k:'rl',l:'Сұйық',opts:[[1000,'Су, 1000 кг/м³'],[800,'Мұнай, 800 кг/м³'],[1260,'Глицерин, 1260 кг/м³']],val:1000},
{k:'fr',l:'Батыру дәрежесі',u:'%',min:0,max:100,step:5,val:50}],
calc(p){const Vs=p.V*p.fr/100,Fa=p.rl*Vs*1e-6*G,P=p.rb*p.V*1e-6*G;return{Fa,P,dyn:Math.max(0,P-Fa)}},
draw(c,p,S){const{Fa,P,dyn}=this.calc(p),wl=200,h=40+p.V/500*70,top=wl-(1-p.fr/100)*h,cx=320;
  c.fillStyle=liquidColor(p.rl);c.fillRect(190,wl,260,190);
  c.fillStyle='#4a6b86';c.fillRect(cx-h/2,top,h,h);c.strokeStyle=C.ink;c.lineWidth=2;c.strokeRect(cx-h/2,top,h,h);
  c.fillStyle=liquidColor(p.rl);c.globalAlpha=.4;c.fillRect(190,wl,260,190);c.globalAlpha=1;
  c.strokeStyle=C.ink;c.lineWidth=3;c.strokeRect(190,110,260,270);c.fillStyle='#fff';c.fillRect(188,100,264,10);
  line(c,cx,62,cx,top,C.ink,2);c.fillStyle='#fff';c.fillRect(cx-22,16,44,48);c.strokeRect(cx-22,16,44,48);
  txt(c,fmt(dyn)+' Н',cx,45,C.teal,'bold 13px Arial','center');
  const cy=top+h/2,k=v=>Math.min(95,8+v*2.6);
  arrow(c,cx,cy,cx,cy+k(P),C.red);txt(c,'P = '+fmt(P)+' Н',cx+h/2+10,cy+k(P),C.red,'bold 13px Arial');
  if(Fa>0.005){arrow(c,cx+h/3,cy,cx+h/3,cy-k(Fa),C.teal);txt(c,'F_A = '+fmt(Fa)+' Н',cx+h/2+10,cy-k(Fa)+10,C.teal,'bold 13px Arial')}
  txt(c,'Динамометр',cx+34,34,C.ink,'12px Arial')},
out(p){const{Fa,P,dyn}=this.calc(p);return`Дененің салмағы P = ${fmt(P)} Н<br>Архимед күші F_A = ${fmt(Fa)} Н<br>Динамометр: P − F_A = <b>${fmt(dyn)} Н</b><br>${Fa>P?'<b class="ok">Дене қалқып тұр: F_A ≥ P</b>':p.rb>p.rl?'Дене толық батса, түбіне кетеді.':'ρ дене < ρ сұйық: дене қалқиды.'}`},
task(){const V=rnd([100,150,200,250,300,400,500]),L=rnd([[1000,'су'],[800,'мұнай'],[1260,'глицерин']]);
  return{q:`Көлемі ${V} см³ дене ${L[1]} (ρ = ${L[0]} кг/м³) ішіне толық батырылған. Оған әсер ететін Архимед күшін тап (g = 10 Н/кг).`,a:+(L[0]*V*1e-6*G).toFixed(3),u:'Н'}}},

/* ---------- 3. Қысым ---------- */
{id:'press',title:'Қысым',
cols:['F, Н','S, см²','S, м²','p, Па'],row:p=>[p.F,p.S,p.S/1e4,Math.round(p.F/(p.S/1e4))],
intro:'p = F / S. Күш пен тірек ауданын өзгертіп, құмдағы ізге қарап қысымның қалай өзгеретінін көр. 1 Па = 1 Н/м².',
ctrls:[{k:'F',l:'Қысым күші F',u:'Н',min:10,max:1000,step:10,val:200},{k:'S',l:'Тірек ауданы S',u:'см²',min:1,max:500,step:1,val:40}],
draw(c,p){const pr=p.F/(p.S/1e4),w=30+p.S*.9,d=Math.max(4,Math.min(90,(Math.log10(pr)-2.6)/4.4*90)),cx=320,top=300;
  c.fillStyle='#dcc99b';c.beginPath();c.moveTo(0,top);c.lineTo(cx-w/2,top);c.lineTo(cx-w/2,top+d);c.lineTo(cx+w/2,top+d);c.lineTo(cx+w/2,top);c.lineTo(640,top);c.lineTo(640,420);c.lineTo(0,420);c.fill();
  c.fillStyle='#4a6b86';c.fillRect(cx-w/2,top+d-70,w,70);c.strokeStyle=C.ink;c.lineWidth=2;c.strokeRect(cx-w/2,top+d-70,w,70);
  const len=20+p.F/1000*120,yt=top+d-70;arrow(c,cx,yt-len-8,cx,yt-4,C.red);txt(c,'F = '+p.F+' Н',cx+14,yt-len/2-8,C.red,'bold 14px Arial');
  line(c,cx-w/2,top+d+16,cx+w/2,top+d+16,C.ink,2);txt(c,'S = '+p.S+' см²',cx,top+d+34,C.ink,'13px Arial','center');
  txt(c,'Із тереңдігі қысымға сәйкес',20,30,C.ink,'13px Arial');txt(c,'p = '+fmt(pr/1000,1)+' кПа',20,54,C.teal,'bold 18px Arial')},
out(p){const S=p.S/1e4,pr=p.F/S;return`p = F / S = ${p.F} Н / ${fmt(S,4)} м² = <b>${Math.round(pr).toLocaleString('ru')} Па</b><br>(${fmt(pr/1000,1)} кПа)<br>Аудан кіші болса, қысым үлкен: пышақ өткір, шаңғы кең.`},
task(){if(Math.random()<.6){const F=rnd([50,100,200,300,400,500,600]),S=rnd([.01,.02,.04,.05]);return{q:`Денеге ${F} Н күш ${fmt(S)} м² ауданға перпендикуляр әсер етеді. Қысымды тап.`,a:+(F/S).toFixed(2),u:'Па'}}
  const p=rnd([1000,2000,5000]),S=rnd([.01,.02,.05]);return{q:`${fmt(S)} м² ауданға ${p} Па қысым түсіп тұр. Қысым күшін тап.`,a:p*S,u:'Н'}}},

/* ---------- 4. Жеңіл механизмдер ---------- */
{id:'lever',title:'Рычаг және блок',
cols:['Механизм','F₁ немесе W, Н','d₁ немесе h, дм','F₂, Н','d₂, дм','Нәтиже'],
row(p){if(p.mode==='lever'){const a=p.F1*p.d1,b=p.F2*p.d2;return['Рычаг',p.F1,p.d1,p.F2,p.d2,`F₁·d₁=${a}; F₂·d₂=${b}; `+(a===b?'тепе-теңдік':a>b?'сол жағы ауыр':'оң жағы ауыр')]}
 return[p.mode==='fixed'?'Қозғалмайтын блок':'Қозғалатын блок',p.W,p.h,'','',p.mode==='fixed'?`F = ${p.W} Н; s = ${p.h} дм`:`F = ${p.W/2} Н; s = ${2*p.h} дм`]},
intro:'Рычагтың тепе-теңдік шарты: F₁ · d₁ = F₂ · d₂. Блок режимінде күштен қанша ұтатыныңды және жолда қанша ұтылатыныңды көр.',
ctrls:[{k:'mode',l:'Механизм',opts:[['lever','Рычаг'],['fixed','Қозғалмайтын блок'],['movable','Қозғалатын блок']],val:'lever'},
{k:'F1',l:'Сол жақ күш F₁',u:'Н',min:5,max:50,step:5,val:20,if:p=>p.mode==='lever'},
{k:'d1',l:'Сол жақ иін d₁',u:'дм',min:1,max:10,step:1,val:3,if:p=>p.mode==='lever'},
{k:'F2',l:'Оң жақ күш F₂',u:'Н',min:5,max:50,step:5,val:30,if:p=>p.mode==='lever'},
{k:'d2',l:'Оң жақ иін d₂',u:'дм',min:1,max:10,step:1,val:2,if:p=>p.mode==='lever'},
{k:'W',l:'Жүк салмағы W',u:'Н',min:10,max:100,step:10,val:60,if:p=>p.mode!=='lever'},
{k:'h',l:'Көтеру биіктігі h',u:'дм',min:0,max:10,step:1,val:5,if:p=>p.mode!=='lever'}],
draw(c,p){
  if(p.mode==='lever'){const a=p.F1*p.d1,b=p.F2*p.d2,th=Math.max(-.3,Math.min(.3,(b-a)/Math.max(a,b)*.5)),u=28,fx=320,fy=250;
    c.fillStyle='#7d8f9c';c.beginPath();c.moveTo(fx-32,350);c.lineTo(fx+32,350);c.lineTo(fx,fy);c.fill();
    c.save();c.translate(fx,fy);c.rotate(th);c.fillStyle=C.amber;c.fillRect(-295,-7,590,14);c.strokeStyle=C.ink;c.lineWidth=2;c.strokeRect(-295,-7,590,14);
    for(let i=1;i<=10;i++){line(c,i*u,-7,i*u,-14,C.ink,1);line(c,-i*u,-7,-i*u,-14,C.ink,1);txt(c,i,i*u,-18,C.ink,'11px Arial','center');txt(c,i,-i*u,-18,C.ink,'11px Arial','center')}c.restore();
    [[-1,p.F1,p.d1],[1,p.F2,p.d2]].forEach(([s,F,d])=>{const x=fx+s*d*u*Math.cos(th),y=fy+s*d*u*Math.sin(th),z=22+F*.5;
      line(c,x,y,x,y+34,C.ink,2);c.fillStyle='#4a6b86';c.fillRect(x-z/2,y+34,z,z);txt(c,F+' Н',x,y+34+z/2+5,'#fff','bold 12px Arial','center');txt(c,'d = '+d+' дм',x,y+34+z+16,C.ink,'12px Arial','center')});
    txt(c,'Тірек нүктесі',fx,372,C.ink,'12px Arial','center')}
  else{const mv=p.mode==='movable',k=11,py=mv?250-k*p.h:70,ly=py+30;
    line(c,180,20,460,20,C.ink,4);
    c.fillStyle='#fff';c.strokeStyle=C.ink;c.lineWidth=3;
    if(mv){line(c,296,20,296,py,C.ink,2);const ye=260-2*k*p.h;line(c,344,py,344,ye,C.ink,2);
      c.beginPath();c.arc(320,py,24,0,7);c.fill();c.stroke();line(c,320,py+24,320,ly,C.ink,2);
      c.fillStyle='#4a6b86';c.fillRect(293,ly,54,54);txt(c,p.W+' Н',320,ly+32,'#fff','bold 13px Arial','center');
      arrow(c,344,ye+40,344,ye,C.red);txt(c,'F = '+p.W/2+' Н',356,ye+20,C.red,'bold 13px Arial')}
    else{const ye=150+k*p.h;line(c,296,py,296,ly+10,C.ink,2);line(c,344,py,344,ye,C.ink,2);
      c.beginPath();c.arc(320,py,24,0,7);c.fill();c.stroke();line(c,320,20,320,py,C.ink,2);
      c.fillStyle='#4a6b86';c.fillRect(271,ly+10,50,50);txt(c,p.W+' Н',296,ly+40,'#fff','bold 13px Arial','center');
      arrow(c,344,ye,344,ye+40,C.red);txt(c,'F = '+p.W+' Н',356,ye+25,C.red,'bold 13px Arial')}}},
out(p){if(p.mode==='lever'){const a=p.F1*p.d1,b=p.F2*p.d2;return`F₁·d₁ = ${p.F1}·${p.d1} = ${a}<br>F₂·d₂ = ${p.F2}·${p.d2} = ${b}<br><b class="${a===b?'ok':'bad'}">${a===b?'Тепе-теңдік сақталды':a>b?'Сол жағы ауыр':'Оң жағы ауыр'}</b>`}
  return p.mode==='fixed'?`F = W = <b>${p.W} Н</b><br>Күштен ұтыс жоқ, тек күш бағыты өзгереді.<br>Жіп жолы s = h = ${p.h} дм`
  :`F = W / 2 = <b>${p.W/2} Н</b><br>Күштен 2 есе ұтамыз.<br>Жіп жолы s = 2h = ${2*p.h} дм: жолда 2 есе ұтыламыз.`},
task(){const t=rnd([0,0,1,2]);
  if(t===1){const W=rnd([20,40,60,80,100]);return{q:`Қозғалмайтын блок арқылы ${W} Н жүкті көтеру үшін қандай күш керек? (үйкеліс пен блок салмағы ескерілмейді)`,a:W,u:'Н'}}
  if(t===2){const W=rnd([20,40,60,80,100]);return{q:`Қозғалатын блок арқылы ${W} Н жүкті көтеру үшін қандай күш керек? (үйкеліс пен блок салмағы ескерілмейді)`,a:W/2,u:'Н'}}
  let F1,d1,F2,d2;do{F2=rnd([5,10,15,20,25,30]);d2=rnd([1,2,3,4,5,6,8,10]);d1=rnd([1,2,3,4,5,6,8,10]);F1=F2*d2/d1}while(!Number.isInteger(F1)||F1<5||F1>50);
  return{q:`Рычагтың оң иініне (${d2} дм) ${F2} Н күш әсер етеді. Сол жақ иін ${d1} дм. Тепе-теңдік үшін сол жақтағы F₁ күші қандай болуы керек?`,a:F1,u:'Н'}}}
];

/* ---------- Құрастыру ---------- */
function parseNum(t){
  let s=t.replace(/,/g,'.').replace(/[·×]/g,'*').replace(/\^/g,'**').replace(/\bsqrt\s*\(/gi,'Math.sqrt(').replace(/\bpi\b/gi,'(Math.PI)').replace(/π/g,'(Math.PI)')
   .replace(/√\s*\(/g,'Math.sqrt(').replace(/√\s*([0-9.]+)/g,'Math.sqrt($1)').replace(/(\d|\))\s*(Math\.|\()/g,'$1*$2');
  if(!s.trim()||!/^[0-9+\-*/().\sMathPIsqrt]*$/.test(s))return NaN;
  try{const v=Function('"use strict";return('+s+')')();return typeof v==='number'&&isFinite(v)?v:NaN}catch(e){return NaN}}
const tabs=$('#tabs'),main=$('#main');
sims.forEach((S,i)=>{
  S.p={};S.ctrls.forEach(k=>S.p[k.k]=k.val);
  const b=document.createElement('button');b.textContent=S.title;b.setAttribute('role','tab');b.onclick=()=>show(i);tabs.append(b);S.btn=b;
  const sec=document.createElement('section');sec.id=S.id;
  const ctr=S.ctrls.map(k=>k.opts?
    `<div class="c" data-k="${k.k}"><label>${k.l}</label><select>${k.opts.map(o=>`<option value="${o[0]}"${o[0]==k.val?' selected':''}>${o[1]}</option>`).join('')}</select></div>`
    :`<div class="c" data-k="${k.k}"><label>${k.l}: <b>${k.val}</b> ${k.u}</label><input type="range" min="${k.min}" max="${k.max}" step="${k.step}" value="${k.val}">${k.free?`<input class="fv" type="text" inputmode="decimal" value="${k.val}" aria-label="${k.l}"><small>Кез келген санды жаз: 2650,75 · √2·1000 · π·800 · sqrt(5)*500</small>`:''}</div>`).join('');
  sec.innerHTML=`<p class="intro">${S.intro}</p><div class="grid"><div class="side">${ctr}${S.extra||''}<div class="out"></div>
  <div class="btns"><button class="rec">Өлшемді кестеге жазу</button><button class="xl">Excel-ге жүктеу</button></div><div class="log"></div>
  <div class="task"><div class="clock">01:30</div><p class="q">Тапсырманы бастау түймесін бас: 1 минут 30 секунд уақыт беріледі.</p>
  <div class="ans"><input class="ai" type="text" inputmode="decimal" disabled placeholder="Жауабың"><span class="u"></span></div>
  <div class="btns"><button class="go">Тапсырманы бастау</button><button class="chk" disabled>Тексеру</button><button class="wa" disabled>WhatsApp-қа жіберу</button></div><p class="msg" aria-live="polite"></p></div></div>
  <canvas width="640" height="420"></canvas></div>`;
  main.append(sec);S.sec=sec;const cv=$('canvas',sec),cx=cv.getContext('2d');
  S.upd=()=>{S.ctrls.forEach(k=>{const w=$(`[data-k=${k.k}]`,sec);w.style.display=(!k.if||k.if(S.p))?'':'none';if(!k.opts)$('b',w).textContent=typeof S.p[k.k]==='number'?fmt(S.p[k.k],3):S.p[k.k]});
    cx.clearRect(0,0,640,420);S.draw(cx,S.p,S);$('.out',sec).innerHTML=S.out(S.p)};
  sec.addEventListener('input',e=>{const w=e.target.closest('[data-k]');if(!w)return;const key=w.dataset.k,t=e.target;
    if(t.classList.contains('fv')){const n=parseNum(t.value),ok=n>0&&n<=25000;t.style.borderColor=ok?'':C.red;if(!ok)return;S.p[key]=n;$('input[type=range]',w).value=n}
    else{const v=t.value;S.p[key]=isNaN(+v)?v:+v;const f=$('.fv',w);if(f){f.value=v;f.style.borderColor=''}}
    S.upd()});
  S.init&&S.init(S,sec);S.rows=[];
  $('.rec',sec).onclick=()=>{S.rows.push([who(),stamp(),...S.row(S.p)]);renderLog(S,$('.log',sec))};
  $('.xl',sec).onclick=exportXls;
  setupTask(S,sec);S.upd()});

function setupTask(S,sec){
  const q=$('.q',sec),inp=$('.ai',sec),go=$('.go',sec),chk=$('.chk',sec),clk=$('.clock',sec),wa=$('.wa',sec),msg=$('.msg',sec),u=$('.u',sec);
  const show=s=>{const m=Math.max(0,Math.ceil(s));clk.textContent=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');clk.classList.toggle('low',s<=15)};
  const stop=()=>{clearInterval(S.iv);inp.disabled=chk.disabled=true};
  const used=()=>Math.min(90,Math.round(90-(S.end-Date.now())/1000));
  const logT=(ans,res)=>{const r=[who(),stamp(),S.title,S.T.q,S.T.a+' '+S.T.u,ans,res,used()];taskRows.push(r);S.last=r;wa.disabled=false};
  wa.onclick=()=>{const r=S.last,t=`Физика зертханасы, 7-сынып\nОқушы: ${r[0]}\nБөлім: ${r[2]}\nСұрақ: ${r[3]}\nОқушы жауабы: ${r[5]} ${S.T.u}\nДұрыс жауап: ${r[4]}\nНәтиже: ${r[6]}\nЖұмсалған уақыт: ${r[7]} с`;window.open('https://wa.me/'+WA_NUMBER+'?text='+encodeURIComponent(t),'_blank')};
  const tick=()=>{const s=(S.end-Date.now())/1000;show(s);if(s<=0){stop();logT(inp.value||'—','Уақыт бітті');msg.className='msg bad';msg.textContent='Уақыт бітті. Дұрыс жауап: '+S.T.a+' '+S.T.u}};
  go.onclick=()=>{S.T=S.task();wa.disabled=true;S.end=Date.now()+90000;q.textContent=S.T.q;u.textContent=S.T.u;inp.value='';inp.disabled=chk.disabled=false;msg.textContent='';msg.className='msg';go.textContent='Жаңа тапсырма';inp.focus();clearInterval(S.iv);S.iv=setInterval(tick,250);tick()};
  chk.onclick=()=>{const x=parseFloat(inp.value.replace(',','.')),a=S.T.a;
    if(isNaN(x)){msg.className='msg bad';msg.textContent='Жауапты сан түрінде жаз.';return}
    if(Math.abs(x-a)<=Math.abs(a)*.02+.001){const left=Math.max(0,Math.round((S.end-Date.now())/1000));logT(x,'Дұрыс');stop();msg.className='msg ok';msg.textContent=`Дұрыс! Қалған уақыт: ${Math.floor(left/60)} мин ${left%60} с.`}
    else{logT(x,'Қате');msg.className='msg bad';msg.textContent='Қате. Симулятордан мәндерді қойып тексеріп, қайта көр.'}};
  inp.onkeydown=e=>{if(e.key==='Enter')chk.click()};show(90)}

/* ---------- Excel-ге жүктеу ---------- */
const WA_NUMBER='77077060407',taskRows=[],who=()=>$('#who').value.trim()||'—',stamp=()=>new Date().toLocaleString('ru-RU');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function renderLog(S,el){el.innerHTML=`<table><tr>${S.cols.map(c=>`<th>${c}</th>`).join('')}</tr>${S.rows.map(r=>`<tr>${r.slice(2).map(v=>`<td>${typeof v==='number'?fmt(v,3):v}</td>`).join('')}</tr>`).join('')}</table>`;el.scrollTop=el.scrollHeight}
function sheet(name,head,rows){const cell=(v,h)=>`<Cell${h?' ss:StyleID="h"':''}><Data ss:Type="${typeof v==='number'&&isFinite(v)?'Number':'String'}">${esc(v)}</Data></Cell>`;
  return`<Worksheet ss:Name="${esc(name)}"><Table><Row>${head.map(h=>cell(h,1)).join('')}</Row>${rows.map(r=>'<Row>'+r.map(v=>cell(v)).join('')+'</Row>').join('')}</Table></Worksheet>`}
function exportXls(){
  const xml='<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Styles><Style ss:ID="h"><Font ss:Bold="1"/></Style></Styles>'
   +sims.map(S=>sheet(S.title,['Оқушы','Уақыты',...S.cols],S.rows)).join('')
   +sheet('Тапсырмалар',['Оқушы','Уақыты','Бөлім','Сұрақ','Дұрыс жауап','Оқушы жауабы','Нәтиже','Жұмсалған уақыт, с'],taskRows)+'</Workbook>';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([xml],{type:'application/vnd.ms-excel'}));a.download='fizika_zertteu.xls';document.body.append(a);a.click();a.remove()}

function show(i){sims.forEach((S,j)=>{S.sec.classList.toggle('on',i===j);S.btn.setAttribute('aria-selected',i===j)})}
show(0);
</script>
